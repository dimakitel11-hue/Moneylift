<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Копилка</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--tz:1;--iz:1;--bg:#141c2d;--card:#1e2335;--line:#2c3350;--ink:#fff;--mute:#9aa1b8;--track:#2e3552;--chip:#eef0f7;--chipink:#1b2030;--cb:#8b93b5;--danger:#ff7b6b;--acc:#d97862;--glow:#d9786280;--soft:#d9786238;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1eee9;--card:#fff;--line:#e3dfd8;--ink:#1d2030;--mute:#777c8f;--track:#e6e2da;--chip:#252a3d;--chipink:#fff;--cb:#a5a9ba;--danger:#c0392b;color-scheme:light}}
:root[data-theme="light"]{--bg:#f1eee9;--card:#fff;--line:#e3dfd8;--ink:#1d2030;--mute:#777c8f;--track:#e6e2da;--chip:#252a3d;--chipink:#fff;--cb:#a5a9ba;--danger:#c0392b;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse 120% 45% at 50% 0,var(--soft),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:500 calc(15px*var(--tz))/1.4 Montserrat,"Segoe UI",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 50px}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
header{display:flex;align-items:center;gap:10px}
h1{flex:1;font-size:calc(30px*var(--tz));line-height:1.15;margin:0;font-weight:800}
.lvl{display:flex;align-items:center;gap:8px;font-size:calc(12px*var(--tz));font-weight:700;max-width:130px}
.lvl b{background:var(--acc);color:var(--accink);border-radius:12px;min-width:38px;height:42px;display:grid;place-items:center;font-size:calc(18px*var(--tz))}
.gear{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:calc(20px*var(--tz))}
.xp{height:12px;border-radius:5px;background:var(--track);margin:14px 0}
.xp i{display:block;height:100%;width:0;background:var(--acc);border-radius:5px;transition:width .5s}
.card{background:var(--card);border:1px solid var(--line);border-radius:34px;padding:20px;margin-bottom:14px}
.gt{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.gt h2{margin:0;font-size:calc(21px*var(--tz));font-weight:800;overflow-wrap:anywhere}
.ct{font-weight:800;font-size:calc(16px*var(--tz));margin-bottom:10px}
.stat{display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.rg{position:relative;width:calc(128px*var(--iz));height:calc(128px*var(--iz));flex:none;margin:0 auto}
.rg svg.r{width:100%;height:100%;transform:rotate(-90deg)}
.tr{fill:none;stroke:var(--track);stroke-width:9}
.pr{fill:none;stroke:var(--acc);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:276.5;transition:stroke-dashoffset .6s;filter:drop-shadow(0 0 5px var(--glow))}
#art{position:absolute;inset:calc(27px*var(--iz))}#art svg{width:100%;display:block;overflow:visible}
.st{flex:1 1 150px;min-width:0}.sub{color:var(--mute);font-size:calc(13px*var(--tz))}
.big{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:calc(clamp(20px,6vw,27px)*var(--tz));font-weight:800;letter-spacing:-.5px;margin:2px 0}
.big span:last-child{color:var(--acc)}
#amt{width:100%;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--bg);font-size:calc(26px*var(--tz));font-weight:800;text-align:center;margin-top:8px}
.q{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.q button{flex:1;padding:10px 12px;border-radius:13px;border:0;background:var(--track);font-weight:700;cursor:pointer}
.r2{display:flex;gap:10px}.r2 .btn{flex:1}
.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:800;cursor:pointer;background:var(--acc);color:var(--accink);box-shadow:0 8px 20px -8px var(--glow)}
.btn.out{background:none;border:1px solid var(--danger);color:var(--danger);box-shadow:none}
.btn.ghost{background:var(--track);color:var(--ink);box-shadow:none}
li{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
ul{margin:0;padding:0}li button{background:none;border:0;color:var(--mute);font-size:calc(20px*var(--tz));cursor:pointer;margin-left:6px}
.pos{color:var(--acc);font-weight:800}.neg{color:var(--danger);font-weight:800}
.empty{color:var(--mute);text-align:center;padding:16px}
dialog input.in{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--card)}

.tabs{display:flex;padding:5px;border:1px solid var(--line);border-radius:22px;background:var(--card);gap:4px}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;border-radius:17px;font-weight:700;color:var(--mute);cursor:pointer}
.tabs button.on{background:var(--chip);color:var(--chipink)}
.mon{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0}
.mon>button{flex:none;width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.pill{flex:1;text-align:center;background:var(--acc);color:var(--accink);padding:13px 18px;border-radius:22px;font-weight:800;font-size:calc(19px*var(--tz));overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 8px 22px -10px var(--glow)}
.sc{overflow-x:auto;margin:0 -8px;padding:0 8px}
.f{display:flex;gap:8px;flex-wrap:wrap}.f .in{flex:1 1 120px;min-width:0;padding:14px;border-radius:15px;border:1px solid var(--line);background:var(--bg)}
.f .in:first-child{flex:1 1 100%}.f .btn{flex:1 1 100%}
.g{padding:16px 0;border-top:1px solid var(--line)}
.gh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:800;font-size:calc(17px*var(--tz))}
.gh small{color:var(--mute);font-weight:700;white-space:nowrap}
.bar{height:12px;border-radius:6px;background:var(--track);margin:10px 0}.bar i{display:block;height:100%;border-radius:6px;background:var(--acc);box-shadow:0 0 10px var(--glow);transition:width .5s}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:10px 14px;border-radius:13px;border:0;background:var(--track);color:var(--ink);font-weight:700;cursor:pointer}
.chips button.on{background:var(--chip);color:var(--chipink)}
.wnv{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.wnv button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.wnv button:disabled{opacity:.3;cursor:default}
.wnv span{font-weight:800;font-size:calc(16px*var(--tz));background:var(--soft);padding:10px 18px;border-radius:15px}
.wg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 4px;text-align:center;align-items:center;justify-items:center}
.wg .dh{width:100%;padding:7px 0;border-radius:13px;font-size:calc(12px*var(--tz));color:var(--mute);font-weight:700}
.cd{width:100%;max-width:46px;aspect-ratio:1;border-radius:13px;border:2px solid var(--cb);background:none;font-weight:700;font-size:calc(13px*var(--tz));color:var(--mute);cursor:pointer;padding:0}
.cd.now{color:var(--acc);font-weight:800}
.cd.on{background:var(--acc);border-color:var(--acc);color:var(--accink);box-shadow:0 0 10px var(--glow)}
.cd.sel{outline:2.5px solid var(--ink);outline-offset:2px}
.cd:disabled{opacity:.22;cursor:default}
.ops{margin-top:10px;font-size:calc(13px*var(--tz));color:var(--mute)}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:cf 1.7s ease-in forwards}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
#amt::placeholder{font-size:calc(16px*var(--tz));font-weight:600}
.hero{background:radial-gradient(circle at 0 0,var(--soft),transparent 65%),var(--card)}
@keyframes pop{40%{transform:scale(1.1)}}
#art.pop{animation:pop .45s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
dialog{border:1px solid var(--line);border-radius:26px;background:var(--bg);color:var(--ink);width:min(94vw,420px);max-height:92vh;padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.6)}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:calc(13px*var(--tz))}
select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shapes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:calc(12px*var(--tz));border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.shapes svg{width:58px;height:46px}.shapes button.on{border:2px solid var(--acc);box-shadow:0 0 14px var(--glow)}
.wwrap{position:relative;width:200px;margin:8px auto}
.wheel{width:200px;height:200px;border-radius:50%;touch-action:none;cursor:pointer;background:conic-gradient(hsl(0 100% 50%),hsl(60 100% 50%),hsl(120 100% 50%),hsl(180 100% 50%),hsl(240 100% 50%),hsl(300 100% 50%),hsl(360 100% 50%));-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%);mask:radial-gradient(circle,transparent 58%,#000 60%)}
.knob{position:absolute;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.4);pointer-events:none;left:0;top:0}
.wc{position:absolute;inset:62px;border-radius:50%;background:var(--acc);box-shadow:0 0 28px var(--glow)}
.sw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sw button.on{border-color:var(--ink)}
.sl{display:flex;align-items:center;gap:10px;margin-top:6px}.sl input{flex:1;accent-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:18px}.row .btn{flex:1}
</style>
</head>

<header><h1 id="ttl"></h1><div class="lvl"><b id="lvn"></b><span id="lvt"></span></div><button class="gear" id="gear" aria-label="settings">⚙</button></header>

 <div id="cg">
  <section class="card hero"><div class="stat"><div class="rg"><svg class="r" viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="44"/><circle class="pr" id="pr" cx="50" cy="50" r="44"/></svg><div id="art"></div></div>

 </div>
</div>
<div id="v1">

<dialog id="dlg">

 <label id="t_color"></label>

 <div class="sw" id="sw"></div>
 <div class="sl"><span>🌙</span><input type="range" id="lig" min="25" max="85"></div>
 <div class="sl"><span>❄</span><input type="range" id="sat" min="0" max="100"></div>
 <label id="t_ts"></label><div class="seg" id="tsSeg"></div>
 <label id="t_is"></label><div class="seg" id="isSeg"></div>
 <label id="t_theme"></label><div class="seg" id="themeSeg"></div>
 <label id="t_cur"></label><select id="cur"></select>
 <label id="t_lang"></label><select id="lang"></select>
 <div class="row"><button class="btn ghost" id="exp">⬇ JSON</button><button class="btn ghost" id="imp">⬆ JSON</button><input type="file" id="impf" accept="application/json,.json" hidden></div>
 <div class="row"><button class="btn out" id="reset"></button><button class="btn" id="close"></button></div>
</dialog>
<dialog id="gd">
 <h2 id="gtitle" style="margin:0 0 6px;font-size:calc(18px*var(--tz))"></h2>
 <label id="l_name"></label><input class="in" id="gname" maxlength="60">
 <label id="l_tgt"></label><input class="in" id="gtarget" type="number" inputmode="decimal" min="0" step="any">
 <div class="row"><button class="btn ghost" id="gcancel"></button><button class="btn" id="gsave"></button></div>
 <div class="row"><button class="btn out" id="gdel"></button></div>
</dialog>

$("cur").onchange=e=>{S.cur=e.target.value;save();render()};
$("lang").onchange=e=>{S.lang=e.target.value;save();render()};
$("reset").onclick=()=>ask(T().confirm).then(ok=>{if(ok){S.goals=[];S.sel=null;S.h=12;S.s=64;S.l=62;$("dlg").close();save();render()}});
wh.addEventListener("pointercancel",()=>{drag=false;save()});
[["gname","gsave"],["gtarget","gsave"],["ngn","nadd"],["ngt","nadd"]].forEach(([i,b])=>$(i).addEventListener("keydown",e=>{if(e.key==="Enter")$(b).click()}));
["dlg","gd","cd"].forEach(id=>$(id).addEventListener("click",e=>{const d=e.currentTarget,b=d.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)d.close()}));
document.addEventListener("visibilitychange",()=>{const n=dk(new Date());if(!document.hidden&&n!==TK){if(SD===TK)SD=n;TK=n;MO=0;render()}});
["amt","ngt","gtarget"].forEach(i=>{const e=$(i);e.type="text";e.inputMode="decimal";e.removeAttribute("min");e.removeAttribute("step");e.addEventListener("input",()=>{e.value=e.value.replace(/[^0-9.,]/g,"")})});
$("exp").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="kopilka-"+TK+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("imp").onclick=()=>$("impf").click();
$("impf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{const o=JSON.parse(x);if(!o||!Array.isArray(o.goals))throw 0;return ask("⬆ JSON?").then(ok=>{if(!ok)return;o.goals.forEach(g=>{g.items=Array.isArray(g.items)?g.items:[];g.target=+g.target||0});Object.assign(S,o);save();theme();render()})}).catch(()=>ask("JSON error",1)).finally(()=>{e.target.value=""})};
theme();render();
</script>
